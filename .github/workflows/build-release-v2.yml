name: 打包并发布西瓜todo v2

# 触发方式：
# 1) 推送以 v 开头的 tag（如 v2.0）→ 打包并自动发布到 Releases 下载页
# 2) 手动运行（Actions 页面点 Run workflow）→ 只打包，产物在 Artifacts 里下载
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  APP_NAME: 西瓜todo
  APP_ID: com.watermelon.desktoptodo
  SRC_DIR: v2
  PY_FILE: todo_qt_v2.py
  SVG_FILE: watermelon_logo.svg
  BALL_FILE: watermelon_ball.svg

jobs:
  # ========================= Windows：exe + Setup 安装程序 =========================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6>=6.5" "PyInstaller>=6.0" "Pillow>=10.0"

      - name: 由 SVG 生成 ico 图标
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          python - <<'PY'
          import sys, io
          sys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding="utf-8")
          sys.stderr = io.TextIOWrapper(sys.stderr.buffer, encoding="utf-8")
          from PySide6.QtCore import QRectF, QSize
          from PySide6.QtGui import QColor, QImage, QPainter
          from PySide6.QtSvg import QSvgRenderer
          from PySide6.QtWidgets import QApplication
          from PIL import Image
          import os
          app = QApplication([])
          r = QSvgRenderer(os.environ["SVG_FILE"])
          assert r.isValid(), "invalid SVG"
          size = QSize(1024, 1024)
          img = QImage(size, QImage.Format_ARGB32)
          img.fill(QColor(0, 0, 0, 0))
          p = QPainter(img)
          r.render(p, QRectF(0, 0, 1024, 1024))
          p.end()
          img.save("watermelon-1024.png", "PNG")
          with Image.open("watermelon-1024.png") as im:
              im.convert("RGBA").save("watermelon.ico", format="ICO",
                  sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print("ico done")
          PY

      - name: 读取版本号
        id: ver
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          V=$(grep -m1 '^APP_VERSION' "$PY_FILE" | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本：$V"

      - name: PyInstaller 打包单文件 exe（无黑框）
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "西瓜todo" \
            --icon "watermelon.ico" \
            --add-data "$SVG_FILE;." \
            --add-data "$BALL_FILE;." \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtWebEngineQuick \
            --exclude-module PySide6.QtWebChannel \
            --exclude-module PySide6.QtWebSockets \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtQuick3D \
            --exclude-module PySide6.QtQuickWidgets \
            --exclude-module PySide6.QtQuickControls2 \
            --exclude-module PySide6.QtMultimedia \
            --exclude-module PySide6.QtMultimediaWidgets \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.Qt3DRender \
            --exclude-module PySide6.Qt3DInput \
            --exclude-module PySide6.Qt3DAnimation \
            --exclude-module PySide6.Qt3DExtras \
            --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.QtDataVisualization \
            --exclude-module PySide6.QtGraphs \
            --exclude-module PySide6.QtOpenGL \
            --exclude-module PySide6.QtOpenGLWidgets \
            --exclude-module PySide6.QtPositioning \
            --exclude-module PySide6.QtLocation \
            --exclude-module PySide6.QtSensors \
            --exclude-module PySide6.QtSerialPort \
            --exclude-module PySide6.QtSql \
            --exclude-module PySide6.QtTest \
            --exclude-module PySide6.QtBluetooth \
            --exclude-module PySide6.QtNfc \
            --exclude-module PySide6.QtDesigner \
            --exclude-module PySide6.QtHelp \
            --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtPdfWidgets \
            --exclude-module PySide6.QtPrintSupport \
            --exclude-module PySide6.QtScxml \
            --exclude-module PySide6.QtStateMachine \
            --exclude-module PySide6.QtTextToSpeech \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module pydoc \
            "$PY_FILE"
          ls -la dist

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 用 Inno Setup 生成 Setup 安装程序
        working-directory: ${{ env.SRC_DIR }}
        shell: bash
        run: |
          cat > watermelon_todo.iss <<'ISS'
          [Setup]
          AppId={{6D51B216-93DF-4E9B-98CA-88A418D115A4}
          AppName=西瓜todo
          AppVersion=${{ steps.ver.outputs.version }}
          UninstallDisplayName=西瓜todo ${{ steps.ver.outputs.version }}
          UninstallDisplayIcon={app}\西瓜todo.exe
          DefaultDirName={autopf}\WatermelonTodo
          DefaultGroupName=西瓜todo
          OutputDir=dist
          OutputBaseFilename=西瓜todo-${{ steps.ver.outputs.version }}-win版-Setup
          SetupIconFile=watermelon.ico
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog
          ; 覆盖安装时自动检测并关闭正在运行的旧版（配合程序里的同名命名互斥体），
          ; 避免旧进程占用 exe 导致卡在 “Closing applications...” 或安装失败。
          AppMutex=WatermelonTodo_AppMutex
          CloseApplications=yes
          CloseApplicationsFilter=*.exe
          RestartApplications=no
          [Languages]
          Name: "chs"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"
          [Files]
          Source: "dist\西瓜todo.exe"; DestDir: "{app}"; Flags: ignoreversion
          [Icons]
          Name: "{autoprograms}\西瓜todo"; Filename: "{app}\西瓜todo.exe"
          Name: "{autodesktop}\西瓜todo"; Filename: "{app}\西瓜todo.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加选项："
          [Run]
          Filename: "{app}\西瓜todo.exe"; Description: "启动 西瓜todo"; Flags: nowait postinstall skipifsilent
          [Code]
          procedure InitializeWizard();
          begin
            MsgBox('温馨提示：' + #13#10#13#10 +
                   '首次运行时，如果 Windows 弹出蓝色的“Windows 已保护你的电脑 / SmartScreen”提示，' + #13#10 +
                   '请点击“更多信息”，再点“仍要运行”即可正常安装使用。'+ #13#10#13#10 +
                   '这是因为本软件未购买付费数字签名，属于正常现象，不影响使用，请放心安装。',
                   mbInformation, MB_OK);
          end;
          ISS
          # ChineseSimplified.isl 是官方语言包，可能缺失，缺失则去掉语言行以免编译失败
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/Languages/ChineseSimplified.isl" ]; then
            sed -i '/\[Languages\]/d; /ChineseSimplified.isl/d' watermelon_todo.iss
          fi
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" watermelon_todo.iss
          # 给便携版 exe 复制一个带「便携版」备注的名字，方便下载页区分
          cp "dist/西瓜todo.exe" "dist/西瓜todo-${{ steps.ver.outputs.version }}-win版-便携版.exe"
          ls -la dist

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            ${{ env.SRC_DIR }}/dist/西瓜todo-*-便携版.exe
            ${{ env.SRC_DIR }}/dist/西瓜todo-*-Setup.exe

  # ========================= macOS：.app + DMG =========================
  build-mac:
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6>=6.5" "PyInstaller>=6.0"

      - name: 读取版本号
        id: ver
        working-directory: ${{ env.SRC_DIR }}
        run: |
          V=$(grep -m1 '^APP_VERSION' "$PY_FILE" | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本：$V"

      - name: 由 SVG 生成 icns 图标
        working-directory: ${{ env.SRC_DIR }}
        run: |
          python - <<'PY'
          from PySide6.QtCore import QRectF, QSize
          from PySide6.QtGui import QColor, QImage, QPainter
          from PySide6.QtSvg import QSvgRenderer
          from PySide6.QtWidgets import QApplication
          import os
          app = QApplication([])
          r = QSvgRenderer(os.environ["SVG_FILE"])
          assert r.isValid(), "无效的 SVG"
          size = QSize(1024, 1024)
          img = QImage(size, QImage.Format_ARGB32)
          img.fill(QColor(0, 0, 0, 0))
          p = QPainter(img)
          r.render(p, QRectF(0, 0, 1024, 1024))
          p.end()
          img.save("watermelon-1024.png", "PNG")
          PY
          mkdir -p watermelon.iconset
          sips -z 16 16   watermelon-1024.png --out watermelon.iconset/icon_16x16.png
          sips -z 32 32   watermelon-1024.png --out watermelon.iconset/icon_16x16@2x.png
          sips -z 32 32   watermelon-1024.png --out watermelon.iconset/icon_32x32.png
          sips -z 64 64   watermelon-1024.png --out watermelon.iconset/icon_32x32@2x.png
          sips -z 128 128 watermelon-1024.png --out watermelon.iconset/icon_128x128.png
          sips -z 256 256 watermelon-1024.png --out watermelon.iconset/icon_128x128@2x.png
          sips -z 256 256 watermelon-1024.png --out watermelon.iconset/icon_256x256.png
          sips -z 512 512 watermelon-1024.png --out watermelon.iconset/icon_256x256@2x.png
          sips -z 512 512 watermelon-1024.png --out watermelon.iconset/icon_512x512.png
          cp watermelon-1024.png watermelon.iconset/icon_512x512@2x.png
          iconutil -c icns watermelon.iconset -o watermelon.icns

      - name: PyInstaller 打包 .app
        working-directory: ${{ env.SRC_DIR }}
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "$APP_NAME" \
            --icon "watermelon.icns" \
            --osx-bundle-identifier "$APP_ID" \
            --add-data "$SVG_FILE:." \
            --add-data "$BALL_FILE:." \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtWebEngineQuick \
            --exclude-module PySide6.QtWebChannel \
            --exclude-module PySide6.QtWebSockets \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtQuick3D \
            --exclude-module PySide6.QtQuickWidgets \
            --exclude-module PySide6.QtQuickControls2 \
            --exclude-module PySide6.QtMultimedia \
            --exclude-module PySide6.QtMultimediaWidgets \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.Qt3DRender \
            --exclude-module PySide6.Qt3DInput \
            --exclude-module PySide6.Qt3DAnimation \
            --exclude-module PySide6.Qt3DExtras \
            --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.QtDataVisualization \
            --exclude-module PySide6.QtGraphs \
            --exclude-module PySide6.QtOpenGL \
            --exclude-module PySide6.QtOpenGLWidgets \
            --exclude-module PySide6.QtPositioning \
            --exclude-module PySide6.QtLocation \
            --exclude-module PySide6.QtSensors \
            --exclude-module PySide6.QtSerialPort \
            --exclude-module PySide6.QtSql \
            --exclude-module PySide6.QtTest \
            --exclude-module PySide6.QtBluetooth \
            --exclude-module PySide6.QtNfc \
            --exclude-module PySide6.QtDesigner \
            --exclude-module PySide6.QtHelp \
            --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtPdfWidgets \
            --exclude-module PySide6.QtPrintSupport \
            --exclude-module PySide6.QtScxml \
            --exclude-module PySide6.QtStateMachine \
            --exclude-module PySide6.QtTextToSpeech \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module pydoc \
            "$PY_FILE"

      - name: 临时签名并生成 DMG
        working-directory: ${{ env.SRC_DIR }}
        run: |
          codesign --force --deep --sign - "dist/$APP_NAME.app"
          mkdir -p dmg_stage
          cp -R "dist/$APP_NAME.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "$APP_NAME" -srcfolder dmg_stage -ov -format UDZO \
            "dist/$APP_NAME-${{ steps.ver.outputs.version }}-mac版.dmg"

      - name: 上传 Mac 产物
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: ${{ env.SRC_DIR }}/dist/西瓜todo-*-mac版.dmg

  # ========================= 发布到 Releases 下载页 =========================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 从 tag 提取版本号（去掉 v 前缀）
        id: ver
        run: |
          TAG="${{ github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: 下载 Mac 产物
        uses: actions/download-artifact@v4
        with:
          name: mac
          path: dist
      - name: 删除同名旧 Release（保留 tag，避免资产已存在冲突）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes || echo "无旧 Release，跳过"
      - name: 创建下载页并挂上安装包
        uses: softprops/action-gh-release@v2
        with:
          name: 西瓜todo ${{ github.ref_name }}
          body: |
            ## 西瓜todo ${{ github.ref_name }}

            请根据你的系统下载对应版本（文件名中的版本号即本次发布版本）：

            ### 🪟 Windows 版
            - 安装版（推荐普通用户）：`西瓜todo-${{ steps.ver.outputs.version }}-win版-Setup.exe`，双击安装，自动创建桌面快捷方式
            - 便携版（免安装）：`西瓜todo-${{ steps.ver.outputs.version }}-win版-便携版.exe`，双击即用（适合放 U 盘或临时使用）

            ### 🍎 Mac 版
            - `西瓜todo-${{ steps.ver.outputs.version }}-mac版.dmg`，双击后把 西瓜todo 拖进「应用程序」

            #### 首次打开的安全提示（正常现象，放心使用）
            本软件未购买付费数字签名，首次打开时系统可能拦截，按下面操作即可：
            - Windows：若弹出蓝色「Windows 已保护你的电脑 / SmartScreen」，点「更多信息」→「仍要运行」
            - Mac：若提示「无法验证开发者」，到「系统设置 → 隐私与安全性」点「仍要打开」

            #### 数据存在哪里
            你的待办数据不会跟着程序走，统一保存在系统用户目录，卸载或移动程序都不会丢失：
            - Windows：`%APPDATA%\DesktopTodo\`
            - Mac：`~/Library/Application Support/DesktopTodo/`
            > 安装版和便携版共用同一份数据，两个版本可随意切换使用。
          files: |
            dist/西瓜todo-*-Setup.exe
            dist/西瓜todo-*-便携版.exe
            dist/西瓜todo-*-mac版.dmg