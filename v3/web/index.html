<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F0405A">
  <title>西瓜待办</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
  :root{
    --bg1:#FFF0F1; --bg2:#F6D9DD; --card:#FFFFFF; --card-hover:#FCE6E8;
    --text:#3A1F24; --sub:#B08890; --accent:#F0405A; --accent2:#FF6E82;
    --done:#E0B7BD; --border:#F6D9DD; --shadow:rgba(122,31,44,.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    min-height: 100vh;
    transition: background .3s;
  }
  #app {
    max-width: 460px; margin: 0 auto; min-height: 100vh;
    display: flex; flex-direction: column;
    padding: 10px 12px calc(20px + env(safe-area-inset-bottom));
  }

  /* 标题栏 */
  .titlebar { display: flex; align-items: center; gap: 10px; padding: 6px 4px 8px; }
  .titles { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .apptitle { font-size: 18px; font-weight: 700; }
  .cheer { font-size: 12px; color: var(--sub); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titlebtn {
    width: 34px; height: 34px; border: none; border-radius: 10px;
    background: var(--card); color: var(--sub); font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px var(--shadow);
  }
  .titlebtn:active { transform: scale(.92); }
  .titlebtn.close { color: var(--accent); }

  /* 统计栏 */
  .stats {
    background: var(--card); border-radius: 16px; padding: 12px 14px;
    margin-bottom: 10px; box-shadow: 0 3px 10px var(--shadow);
  }
  .stats-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .stats-text { font-size: 14px; font-weight: 600; }
  .stats-pct { font-size: 14px; color: var(--accent); font-weight: 700; }
  .barbg { height: 8px; background: var(--border); border-radius: 6px; overflow: hidden; }
  .barfg { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 6px; transition: width .4s; }

  /* tab */
  .tabs { display: flex; gap: 8px; margin-bottom: 10px; }
  .tabbtn {
    flex: 1; height: 38px; border: none; border-radius: 12px; cursor: pointer;
    background: var(--card); color: var(--sub); font-size: 14px; font-weight: 600;
    box-shadow: 0 2px 6px var(--shadow);
  }
  .tabbtn.active { background: var(--accent); color: #fff; }

  /* 添加按钮 */
  .addbtn {
    width: 100%; height: 44px; border: none; border-radius: 14px; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 700;
    margin-bottom: 10px; box-shadow: 0 4px 12px var(--shadow);
  }
  .addbtn:active { transform: scale(.98); }

  /* 项目栏 / 分类栏 */
  .projbar { display: none; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .projbar.show { display: flex; }
  .row { display: flex; gap: 8px; }
  select, input[type=text], textarea {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 10px 12px; font-size: 14px; outline: none; width: 100%;
    font-family: inherit;
  }
  .secondarybtn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 12px; height: 38px; padding: 0 12px; font-size: 13px; cursor: pointer;
  }
  .chip-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 10px; }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; border: 1px solid var(--border); background: var(--card);
    color: var(--sub); border-radius: 20px; height: 30px; padding: 0 14px;
    font-size: 13px; cursor: pointer; line-height: 30px; white-space: nowrap;
  }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip.add { color: var(--accent); }

  /* 任务列表 */
  #list { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card {
    position: relative; display: flex; gap: 9px; background: var(--card);
    border-radius: 14px; padding: 10px 12px 10px 9px; box-shadow: 0 2px 8px var(--shadow);
    align-items: flex-start;
  }
  .card.done .title { text-decoration: line-through; color: var(--done); }
  .pbar { width: 3px; border-radius: 3px; align-self: stretch; flex-shrink: 0; }
  .dot {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--sub);
    flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--accent); background: transparent; margin-top: 1px;
  }
  .dot.done { border-color: var(--accent); color: var(--accent); }
  .dot.doing { border-color: var(--accent); color: var(--accent); }
  .card-middle { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .title { font-size: 15px; line-height: 1.35; word-break: break-word; }
  .note-preview { font-size: 12.5px; color: var(--sub); word-break: break-word; }
  .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .badge {
    font-size: 11.5px; padding: 2px 8px; border-radius: 8px; line-height: 1.5;
  }
  .badge.prio { background: rgba(242,40,90,.12); color: var(--accent); font-weight: 600; }
  .badge.cat { background: var(--border); color: var(--text); }
  .badge.due { background: rgba(0,0,0,.05); color: var(--sub); }
  .badge.due-urgent { background: rgba(242,40,90,.16); color: #D92D20; font-weight: 600; }
  .badge.recur, .badge.remind { background: rgba(0,0,0,.05); color: var(--sub); }
  .badge.strong { background: rgba(242,40,90,.16); color: #D92D20; font-weight: 600; }
  .badge.sub { background: rgba(0,0,0,.05); color: var(--sub); }
  .edit-btn {
    position: absolute; right: 10px; top: 9px; width: 26px; height: 26px;
    border: none; background: transparent; color: var(--sub); font-size: 15px; cursor: pointer;
    border-radius: 8px; display: none;
  }
  .card:hover .edit-btn { display: flex; align-items: center; justify-content: center; }
  .edit-btn:active { background: var(--card-hover); }
  .pinmark { position: absolute; right: 10px; top: 9px; font-size: 13px; }
  .subpanel { display: none; flex-direction: column; gap: 4px; padding: 4px 0 0 30px; }
  .subpanel.show { display: flex; }
  .subitem { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text); cursor: pointer; }
  .subitem .box { width: 16px; text-align: center; }
  .subitem.done { color: var(--done); text-decoration: line-through; }

  .empty { text-align: center; color: var(--sub); padding: 50px 0; line-height: 1.8; font-size: 14px; }

  /* 批量条 */
  .batchbar {
    display: none; align-items: center; gap: 8px; background: var(--card);
    border-radius: 14px; padding: 8px 12px; margin-top: 10px; box-shadow: 0 2px 8px var(--shadow);
  }
  .batchbar.show { display: flex; }
  .batchlbl { font-size: 13px; color: var(--sub); flex: 1; }
  .batchbtn {
    border: 1px solid var(--border); background: transparent; color: var(--text);
    border-radius: 10px; height: 34px; padding: 0 12px; font-size: 13px; cursor: pointer;
  }
  .batchdanger { border-color: var(--accent); color: var(--accent); }

  /* 弹窗 */
  .sheet {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none;
    align-items: flex-end; z-index: 50;
  }
  .sheet.open { display: flex; }
  .sheet-inner {
    background: var(--card); width: 100%; max-width: 460px; margin: 0 auto;
    border-radius: 20px 20px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y: auto; color: var(--text);
  }
  .sheet-inner h2 { margin: 0 0 4px; font-size: 17px; }
  .sheet-inner .hint { font-size: 12px; color: var(--sub); margin: 0 0 14px; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  .field.inline { display: flex; align-items: center; gap: 8px; }
  .field.inline label { margin: 0; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn {
    flex: 1; height: 44px; border: none; border-radius: 14px; font-size: 15px;
    font-weight: 600; cursor: pointer; background: var(--accent); color: #fff;
  }
  .btn.grey { background: var(--border); color: var(--text); }
  .btn.danger { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .small-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--accent);
    border-radius: 12px; height: 38px; padding: 0 14px; font-size: 13px; cursor: pointer;
  }

  /* 小步骤 */
  .subtask { display: flex; align-items: center; gap: 8px; background: var(--bg1); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; margin-bottom: 6px; font-size: 14px; }
  .subtask input[type=checkbox] { width: 18px; height: 18px; flex-shrink: 0; }
  .subtask span { flex: 1; word-break: break-word; }
  .subtask.done span { text-decoration: line-through; color: var(--done); }
  .subtask .sub-del { color: var(--sub); font-size: 16px; padding: 0 4px; flex-shrink: 0; }

  /* 主题网格 */
  .theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .theme-cell { border-radius: 12px; padding: 10px 6px; text-align: center; font-size: 12px; border: 2px solid transparent; cursor: pointer; color: var(--text); }
  .theme-cell.active { border-color: var(--accent); }
  .theme-cell .swatch { width: 100%; height: 26px; border-radius: 8px; margin-bottom: 5px; }
  .diy { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .diy .diy-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); }
  .diy .diy-row input[type=color] { width: 36px; height: 30px; border: none; background: none; padding: 0; }

  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) scale(.9);
    background: rgba(0,0,0,.82); color: #fff; padding: 9px 18px; border-radius: 20px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: .2s; z-index: 80; max-width: 80%;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
  </style>
</head>
<body>
  <div id="app">
    <div class="titlebar">
      <div class="titles">
        <div class="apptitle">🍉 西瓜待办</div>
        <div class="cheer" id="cheer">加油啦！✨</div>
      </div>
      <button class="titlebtn" id="syncBtn" title="多端同步">☁</button>
      <button class="titlebtn" id="themeBtn" title="主题配色">🎨</button>
      <button class="titlebtn" id="menuBtn" title="更多设置">⋮</button>
      <button class="titlebtn close" id="minBtn" title="隐藏到后台">—</button>
    </div>

    <div class="stats">
      <div class="stats-top">
        <span class="stats-text" id="statsText">今日 0/0</span>
        <span class="stats-pct" id="statsPct">0%</span>
      </div>
      <div class="barbg"><div class="barfg" id="barFg" style="width:0%"></div></div>
    </div>

    <div class="tabs">
      <button class="tabbtn active" id="tabDaily">📋 日常待办</button>
      <button class="tabbtn" id="tabProject">📁 项目待办</button>
    </div>

    <button class="addbtn" id="addBtn">＋ 添加待办</button>

    <div class="projbar" id="projBar">
      <div class="row">
        <select id="projectPicker" style="flex:1"></select>
        <button class="secondarybtn" id="projManage" style="width:40px">⚙</button>
      </div>
      <div class="row">
        <button class="secondarybtn" id="batchAddBtn" style="flex:3">批量添加</button>
        <button class="secondarybtn" id="exportBtn" style="flex:1">导出</button>
        <button class="secondarybtn" id="multiBtn" style="flex:1">多选</button>
        <button class="secondarybtn" id="selAllBtn" style="flex:1;display:none">全选</button>
      </div>
    </div>

    <div class="chip-row" id="chipRow"></div>

    <div id="list"></div>

    <div class="batchbar" id="batchBar">
      <span class="batchlbl" id="batchLbl">已选 0</span>
      <button class="batchbtn" id="batchDone">✓完成</button>
      <button class="batchbtn" id="batchCat">改分类</button>
      <button class="batchdanger" id="batchDel">✕删除</button>
    </div>
  </div>

  <!-- 编辑/新建 弹窗 -->
  <div class="sheet" id="editSheet">
    <div class="sheet-inner">
      <h2 id="editTitle">编辑待办</h2>
      <div class="field">
        <label for="editText">内容</label>
        <input type="text" id="editText" placeholder="输入待办内容…" maxlength="200">
      </div>
      <div class="field">
        <label for="editPriority">优先级</label>
        <select id="editPriority">
          <option>P0</option><option>P1</option><option>P2</option><option>重要</option><option>普通</option>
        </select>
      </div>
      <div class="field">
        <label for="editCategory">分类</label>
        <select id="editCategory"></select>
      </div>
      <div class="field">
        <label for="editDue">截止时间</label>
        <input type="datetime-local" id="editDue">
      </div>
      <div class="field">
        <label for="editRecur">循环</label>
        <select id="editRecur">
          <option>不循环</option><option>每日</option><option>工作日</option><option>每周</option><option>每月</option><option>每年</option>
        </select>
      </div>
      <div class="field">
        <label for="editRemind">提醒</label>
        <select id="editRemind">
          <option>到期当天</option><option>关闭提醒</option><option>结束前10分钟</option><option>结束前30分钟</option><option>结束前2小时</option><option>提前1天</option><option>提前3天</option>
        </select>
      </div>
      <div class="field">
        <label for="editNote">备注</label>
        <textarea id="editNote" placeholder="记录进行中的注意事项…" rows="3"></textarea>
      </div>
      <div class="field">
        <label>小步骤</label>
        <div id="subtaskList"></div>
        <div class="row" style="margin-top:8px">
          <input type="text" id="subtaskInput" placeholder="添加一个步骤…" maxlength="120">
          <button class="small-btn" id="subtaskAdd" type="button">添加</button>
        </div>
      </div>
      <div class="sheet-actions" style="margin-top:4px">
        <button class="btn grey" id="editStrong" type="button">🔔 强提醒</button>
      </div>
      <div class="field inline">
        <input type="checkbox" id="editPin" style="width:auto">
        <label for="editPin" style="margin:0">置顶</label>
      </div>
      <div class="sheet-actions">
        <button class="btn grey" id="editCancel">取消</button>
        <button class="btn" id="editSave">保存</button>
        <button class="btn danger" id="editDelete">删除</button>
      </div>
    </div>
  </div>

  <!-- 强提醒弹窗 -->
  <div class="sheet" id="strongSheet">
    <div class="sheet-inner">
      <h2>🔔 强提醒设置</h2>
      <p class="hint">在截止前的时间窗内反复提醒，适合「今天必须交」的事。设了参数即启用。</p>
      <div class="field">
        <label>在截止前</label>
        <div class="row">
          <input type="number" id="strongBeforeVal" min="0" value="0" style="width:90px">
          <select id="strongBeforeUnit" style="flex:1">
            <option>天</option><option>小时</option><option>分钟</option>
          </select>
          <span style="color:var(--sub);font-size:13px;align-self:center">开始提醒</span>
        </div>
      </div>
      <div class="field">
        <label>每隔</label>
        <div class="row">
          <input type="number" id="strongIntervalVal" min="0" value="1" style="width:90px">
          <select id="strongIntervalUnit" style="flex:1">
            <option>天</option><option>小时</option><option>分钟</option>
          </select>
          <span style="color:var(--sub);font-size:13px;align-self:center">提醒一次</span>
        </div>
      </div>
      <div class="field">
        <label>最多提醒</label>
        <div class="row">
          <input type="number" id="strongMaxCount" min="0" value="0" style="width:90px">
          <span style="color:var(--sub);font-size:13px;align-self:center">次（0 = 不限）</span>
        </div>
      </div>
      <div class="field inline">
        <input type="checkbox" id="strongFloat" style="width:auto">
        <label for="strongFloat" style="margin:0">用悬浮小西瓜浮窗提醒（手机端以通知代替）</label>
      </div>
      <div class="sheet-actions">
        <button class="btn grey" id="strongCancel">取消</button>
        <button class="btn" id="strongSave">确定</button>
      </div>
    </div>
  </div>

  <!-- 同步弹窗 -->
  <div class="sheet" id="syncSheet">
    <div class="sheet-inner">
      <h2>多端同步</h2>
      <div class="field">
        <label for="syncUrl">服务器地址</label>
        <input type="text" id="syncUrl" placeholder="例如 http://47.120.58.231:52121">
      </div>
      <div class="field">
        <label for="syncCode">同步码（两端一致即可互通）</label>
        <input type="text" id="syncCode" placeholder="随便设一个，两端相同">
      </div>
      <div class="sheet-actions">
        <button class="btn grey" id="syncCancel">取消</button>
        <button class="btn" id="syncNow">保存并同步</button>
      </div>
    </div>
  </div>

  <!-- 更多设置 -->
  <div class="sheet" id="menuSheet">
    <div class="sheet-inner">
      <h2>更多设置</h2>
      <p class="hint">🍉 西瓜待办</p>
      <div class="sheet-actions" style="flex-direction:column;gap:10px">
        <button class="btn grey" id="menuAddCat">＋ 添加分类</button>
        <button class="btn grey" id="menuClearDone">清除已完成</button>
        <button class="btn grey" id="menuHide">隐藏到后台</button>
      </div>
    </div>
  </div>

  <!-- 主题配色弹窗 -->
  <div class="sheet" id="themeSheet">
    <div class="sheet-inner">
      <h2>主题配色</h2>
      <p class="hint">选择与电脑版一致的配色，下次打开仍生效。</p>
      <div class="theme-grid" id="themeGrid"></div>
      <div class="field" style="margin-top:16px">
        <label>自定义配色</label>
        <div class="diy" id="diyColors"></div>
        <button class="small-btn" id="diyApply" type="button" style="margin-top:10px">应用自定义配色</button>
      </div>
      <div class="sheet-actions">
        <button class="btn grey" id="themeCancel">关闭</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
